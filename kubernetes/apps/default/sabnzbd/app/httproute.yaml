apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - sabnzbd.int.kirstein.me
  rules:
    - backendRefs:
        - name: sabnzbd
          port: 8080
