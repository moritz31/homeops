---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: immich
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.4.0
            env: 
              DB_HOSTNAME: "immich-database-rw.default.svc.cluster.local"
              DB_DATABASE_NAME: "app"
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: username
              DB_PASSWORD: 
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
    valkey:
      enabled: true
    server:
      enabled: true
      route:
        main:
          parentRefs:
            - name: public
              namespace: networking
              sectionName: https
          hostnames:
            - photos.kirstein.me
          rules:
            - timeouts:
                request: 0s
              backendRefs:
                - identifier: main
        redirect:
          parentRefs:
            - name: public
              namespace: networking
              sectionName: http
          hostnames:
            - photos.kirstein.me
          rules:
            - filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
    machine-learning:
      enabled: true
      persistence:
        cache:
          type: persistentVolumeClaim
          existingClaim: immich-ml-pvc
