# UniFi serves a self-signed certificate on 8443. Replace this with a
# validated BackendTLSPolicy when UniFi is configured with a trusted certificate.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi-tls
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: unifi.default.svc.cluster.local
        port: 8443
  tls:
    insecureSkipVerify: true
