# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: unifi
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: unifi
            patch: |
              - op: remove
                path: /spec/selector/matchLabels/app.kubernetes.io~1controller
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      unifi:
        strategy: Recreate
        containers:
          app:
            image:
              repository: jacobalberty/unifi
              tag: v10.0.162
            env:
              TZ: UTC
              RUNAS_UID0: "false"
              UNIFI_UID: "999"
              UNIFI_GID: "999"
              UNIFI_STDOUT: "true"
              JVM_MAX_HEAP_SIZE: 1024M
            probes:
              liveness: &probe
                enabled: true
                type: TCP
                port: 8443
              readiness: *probe
              startup:
                enabled: true
                type: TCP
                port: 8443
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    defaultPodOptions:
      enableServiceLinks: true
      securityContext:
        fsGroup: 999
    service:
      main:
        controller: unifi
        type: LoadBalancer
        ports:
          http:
            port: 8443
          controller:
            port: 8080
          speedtest:
            port: 6789
          stun:
            port: 3478
            protocol: UDP
          syslog:
            port: 5514
            protocol: UDP
          discovery:
            port: 10001
            protocol: UDP
    persistence:
      data:
        forceRename: unifi-data
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /unifi
    route:
      app:
        forceRename: unifi-gateway
        parentRefs:
          - name: public
            namespace: networking
            sectionName: https
        hostnames:
          - unifi.kirstein.me
        rules:
          - backendRefs:
              - group: gateway.envoyproxy.io
                kind: Backend
                name: unifi-tls
      redirect:
        forceRename: unifi-gateway-redirect
        parentRefs:
          - name: public
            namespace: networking
            sectionName: http
        hostnames:
          - unifi.kirstein.me
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
