---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: sonarr
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: media-servarr
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    secrets:
      - name: apiKey
        value: ${SECRET_SONARR_API_KEY}
    application:
      port: 80
      urlBase: ''
      config:
        secrets: [apiKey]
        filename: 'config.xml'
        contents: |
          <Config>
            <LogLevel>info</LogLevel>
            <EnableSsl>False</EnableSsl>
            <AnalyticsEnabled>False</AnalyticsEnabled>
            <AuthenticationMethod>External</AuthenticationMethod>
            <ApiKey>$apiKey</ApiKey>
            <Port>80</Port>
          </Config>
    ingress:
      enabled: true
      className: internal-ingress
      host: sonarr.int.kirstein.me 
    deployment:
      container:
        volumeMounts:
        - name: 'config'
          mountPath: '/config'
        - name: 'media'
          mountPath: '/data'
      volumes:
        config:
          persistentVolumeClaim:
            claimName: 'sonarr-config'
        media:
          persistentVolumeClaim:
            claimName: 'shared-media-data'
    persistentVolumeClaims:
      sonarr-config:
        storageClassName: "nfs-client"
