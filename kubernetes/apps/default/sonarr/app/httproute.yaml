apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - sonarr.int.kirstein.me
  rules:
    - backendRefs:
        - name: sonarr
          port: 80
