---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: default
spec:
  interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      authelia:
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.24
            env:
            - name: TZ
              value: Europe/Berlin
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 80
              readiness:
                enabled: true
                type: TCP
                port: 80
              startup:
                enabled: true
                type: TCP
                port: 80
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            args:
            - "--config"
            - "/etc/authelia/config.yaml"
            envFrom:
            - secretRef:
                name: authelia-secret
            resources:
              requests:
                cpu: '0.25'
                memory: 250Mi
              limits:
                memory: 250Mi
        type: statefulset
    defaultPodOptions:
      enableServiceLinks: false
    service:
      main:
        controller: authelia
        ports:
          http:
            port: 80
          metrics:
            port: 8080
    persistence:
      data:
        forceRename: authelia-data
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
        - path: "/config"
      config:
        type: configMap
        name: authelia-config
        globalMounts:
        - path: "/etc/authelia/config.yaml"
          subPath: config.yaml
          readOnly: false
    route:
      app:
        forceRename: authelia-gateway
        parentRefs:
          - name: public
            namespace: networking
            sectionName: https
        hostnames:
          - auth.kirstein.me
        rules:
          - backendRefs:
              - identifier: main
                port: 80
      redirect:
        forceRename: authelia-gateway-redirect
        parentRefs:
          - name: public
            namespace: networking
            sectionName: http
        hostnames:
          - auth.kirstein.me
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
  chartRef:
    kind: OCIRepository
    name: authelia
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: StatefulSet
          name: authelia
        patch: |
          - op: remove
            path: /spec/selector/matchLabels/app.kubernetes.io~1controller
