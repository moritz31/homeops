---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-unifi-mcp
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-unifi
  path: ./kubernetes/apps/default/unifi-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: unifi-mcp
      namespace: default
  interval: 30m
  retryInterval: 1m
  timeout: 3m
