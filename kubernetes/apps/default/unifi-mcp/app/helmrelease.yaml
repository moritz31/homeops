---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: unifi-mcp
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      unifi-mcp:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              # Replace with a verified release tag and digest before activation.
              tag: latest
            env:
              TZ: Europe/Berlin
              UNIFI_NETWORK_HOST: unifi.default.svc.cluster.local
              UNIFI_NETWORK_PORT: "8443"
              UNIFI_NETWORK_SITE: 5vphwlie
              UNIFI_READ_ONLY: "true"
              UNIFI_NETWORK_WEBSOCKET_ENABLED: "false"
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_PORT: "3000"
              UNIFI_MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,unifi-mcp:*,unifi-mcp.default.svc.cluster.local:*
            envFrom:
              - secretRef:
                  name: unifi-mcp-secret
            probes:
              liveness: &probe
                enabled: true
                type: TCP
                port: 3000
              readiness: *probe
              startup:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: unifi-mcp
        ports:
          http:
            port: 3000
