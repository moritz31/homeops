---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cups
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cups
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cups
            patch: |
              - op: remove
                path: /spec/selector/matchLabels/app.kubernetes.io~1controller
              - op: add
                path: /spec/selector/matchLabels/app.kubernetes.io~1component
                value: cups
              - op: add
                path: /spec/template/metadata/labels/app.kubernetes.io~1component
                value: cups
  values:
    controllers:
      cups:
        strategy: Recreate
        initContainers:
          initialize-config:
            image:
              repository: docker.io/olbat/cupsd
              tag: stable-2026-08-03
            command:
              - /bin/sh
              - -ec
              - |
                if [ ! -f /config/cupsd.conf ]; then
                  cp -a /etc/cups/. /config/
                fi
        containers:
          app:
            image:
              repository: docker.io/olbat/cupsd
              tag: stable-2026-08-03
            command:
              - /bin/sh
              - -ec
              - |
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y --no-install-recommends \
                  avahi-daemon \
                  cups-backend-bjnp \
                  printer-driver-gutenprint
                mkdir -p /run/dbus
                dbus-daemon --system --fork
                avahi-daemon --daemonize

                /usr/sbin/cupsd -f &
                cupsd_pid=$!
                trap 'kill -TERM "$cupsd_pid"; wait "$cupsd_pid"; exit' TERM INT
                until [ -S /run/cups/cups.sock ]; do sleep 1; done
                cupsctl --share-printers
                wait "$cupsd_pid"
            env:
              TZ: Europe/Berlin
            ports:
              - name: ipp
                containerPort: 631
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: ipp
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 7
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: cups
        type: LoadBalancer
        ports:
          ipp:
            port: 631
            protocol: TCP
    route:
      main:
        parentRefs:
          - name: internal
            namespace: networking
            sectionName: https
        hostnames:
          - print.int.kirstein.me
        rules:
          - backendRefs:
              - identifier: app
    persistence:
      config:
        enabled: true
        forceRename: cups-config
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          cups:
            initialize-config:
              - path: /config
            app:
              - path: /etc/cups
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/cups
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/cups
      runtime:
        type: emptyDir
        globalMounts:
          - path: /run/cups
