---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cups
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      cups:
        initContainers:
          initialize-config:
            image:
              repository: docker.io/olbat/cupsd
              tag: stable-2026-07-20
            command:
              - /bin/sh
              - -ec
              - |
                if [ ! -f /config/cupsd.conf ]; then
                  cp -a /etc/cups/. /config/
                fi
        containers:
          app:
            image:
              repository: docker.io/olbat/cupsd
              tag: stable-2026-07-20
            env:
              TZ: Europe/Berlin
            ports:
              - name: ipp
                containerPort: 631
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: ipp
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 7
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: cups
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: print.nas01.kirstein.me
        ports:
          ipp:
            port: 631
            protocol: TCP
    persistence:
      config:
        enabled: true
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          cups:
            initialize-config:
              - path: /config
            app:
              - path: /etc/cups
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/cups
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/cups
      runtime:
        type: emptyDir
        globalMounts:
          - path: /run/cups
