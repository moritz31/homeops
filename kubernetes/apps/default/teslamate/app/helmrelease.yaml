---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: teslamate
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      teslamate:
        # The previous chart uses a different immutable Deployment selector.
        forceRename: teslamate-app
        strategy: Recreate
        containers:
          app:
            image:
              repository: teslamate/teslamate
              tag: 4.4.0
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  periodSeconds: 5
                  failureThreshold: 30
                  timeoutSeconds: 1
              liveness: &health-probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  periodSeconds: 10
                  failureThreshold: 3
                  timeoutSeconds: 1
              readiness: *health-probe
            env:
              DATABASE_HOST: teslamate-database-rw
              DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-database-app
                    key: username
              DATABASE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-database-app
                    key: password
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-encryption
                    key: key
              DATABASE_NAME: app
              DISABLE_MQTT: "true"
              VIRTUAL_HOST: tesla.int.kirstein.me
    service:
      main:
        controller: teslamate
        ports:
          http:
            port: 4000
    route:
      main:
        kind: HTTPRoute
        parentRefs:
          - name: internal
            namespace: networking
            sectionName: https
        hostnames:
          - tesla.int.kirstein.me
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
