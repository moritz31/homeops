apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: default
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: https
  hostnames:
    - jellyfin.kirstein.me
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: jellyfin
          port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-redirect
  namespace: default
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: http
  hostnames:
    - jellyfin.kirstein.me
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
