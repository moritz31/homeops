---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: default
spec:
  interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      paperless:
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.15
            env:
            - name: COMPOSE_PROJECT_NAME
              value: paperless-ngx
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_URL
              value: https://paperless.kirstein.me
            - name: PAPERLESS_PORT
              value: 8000
            - name: PAPERLESS_DBHOST
              value: paperless-database-rw
            - name: PAPERLESS_DBNAME
              value: app
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-database-app
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-database-app
                  key: password
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: USERMAP_UID
              value: 33
            - name: USERMAP_GID
              value: 33
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/paperless/consume"
            - name: PAPERLESS_DATA_DIR
              value: "/paperless/data"
            - name: PAPERLESS_MEDIA_ROOT
              value: "/paperless/media"
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{created_year}/{correspondent}/{title}"
            - name: PAPERLESS_FILENAME_FORMAT_REMOVE_NONE
              value: true
            - name: PAPERLESS_CONSUMER_POLLING
              value: 60
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: true
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: true
            - name: PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS
              value: true
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu+eng
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-encryption
                  key: key
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-encryption
                  key: username
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-encryption
                  key: password
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-encryption
                  key: paperless_socialaccount_providers
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: true
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 8000
              readiness:
                enabled: true
                type: TCP
                port: 8000
              startup:
                enabled: true
                type: TCP
                port: 8000
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
        strategy: Recreate
    defaultPodOptions:
      enableServiceLinks: true
    service:
      main:
        controller: paperless
        ports:
          http:
            port: 8000
    ingress:
      main:
        className: external-ingress
        annotations:
          external-dns.alpha.kubernetes.io/target: home.kirstein.me
          nginx.ingress.kubernetes.io/proxy-body-size: 10m
        hosts:
        - host: paperless.kirstein.me
          paths:
          - path: "/"
            pathType: Prefix
            service:
              identifier: main
              port: 8000
        tls:
        - hosts:
          - paperless.kirstein.me
    persistence:
      data:
        forceRename: paperless-data
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
        - path: "/paperless"
    route:
      app:
        forceRename: paperless-gateway
        parentRefs:
          - name: public
            namespace: networking
            sectionName: https
        hostnames:
          - paperless.kirstein.me
        rules:
          - backendRefs:
              - identifier: main
                port: 8000
      redirect:
        forceRename: paperless-gateway-redirect
        parentRefs:
          - name: public
            namespace: networking
            sectionName: http
        hostnames:
          - paperless.kirstein.me
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
  chartRef:
    kind: OCIRepository
    name: paperless
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: paperless
        patch: |
          - op: remove
            path: /spec/selector/matchLabels/app.kubernetes.io~1controller
