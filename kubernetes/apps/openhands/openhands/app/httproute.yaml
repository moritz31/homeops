apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openhands
  namespace: openhands
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - openhands.int.kirstein.me
  rules:
    - backendRefs:
        - name: openhands
          port: 8000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: openhands
  namespace: openhands
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: openhands
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 3600s
