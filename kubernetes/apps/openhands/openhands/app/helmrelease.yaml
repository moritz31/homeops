---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openhands
  namespace: openhands
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ./helm/agent-canvas
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openhands
        namespace: flux-system
      interval: 1h
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: openhands
    replicaCount: 1
    image:
      repository: ghcr.io/openhands/agent-canvas
      tag: 1.27.1
    serviceAccount:
      automountServiceAccountToken: false
    rbac:
      enabled: false
    config:
      extraEnv:
      - name: TZ
        value: Europe/Berlin
      - name: AUTOMATION_BASE_URL
        value: https://openhands.int.kirstein.me
      # Embed the backend session key for automatic setup on the trusted internal UI.
      - name: AGENT_CANVAS_ALLOW_LAN_SESSION_KEY
        value: "true"
    ingress:
      enabled: true
      className: internal-ingress
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-body-size: 50m
      hosts:
      - host: openhands.int.kirstein.me
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - openhands.int.kirstein.me
    persistence:
      enabled: true
      storageClassName: nfs-client
      accessModes:
      - ReadWriteOnce
      size: 5Gi
      mounts:
      - mountPath: /home/openhands/.openhands
        subPath: openhands
      - mountPath: /home/openhands/workspace
        subPath: workspace
      - mountPath: /home/openhands/.codex
        subPath: codex
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: null
        memory: 2Gi
