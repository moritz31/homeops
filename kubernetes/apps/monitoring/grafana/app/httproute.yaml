apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: http
  hostnames:
    - grafana.kirstein.me
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
