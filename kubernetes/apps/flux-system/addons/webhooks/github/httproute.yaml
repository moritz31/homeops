apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: https
  hostnames:
    - flux-webhook.kirstein.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-redirect
  namespace: flux-system
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: http
  hostnames:
    - flux-webhook.kirstein.me
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
