---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-envoy-gateway
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/networking/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: networking
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-envoy-gateway-certificate
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-cert-manager-issuers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/apps/networking/envoy-gateway/certificate
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: kirstein-me-internal
      namespace: networking
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-envoy-gateway-internal
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-envoy-gateway
    - name: cluster-apps-envoy-gateway-certificate
    - name: cluster-apps-metallb-config
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/networking/envoy-gateway/internal
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
