apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: networking
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      hostname: "*.int.kirstein.me"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.int.kirstein.me"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: kirstein-me-internal-tls
      allowedRoutes:
        namespaces:
          from: All
